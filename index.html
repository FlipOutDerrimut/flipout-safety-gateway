<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Briefing | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Unbounded', sans-serif; 
            background-color: #0F041D; /* Flip Out Velvet */
            color: #FFFFFF; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        #lockout-page { text-align: center; width: 100%; max-width: 400px; }
        #video-page { display: none; width: 100%; text-align: center; }
        h1 { font-weight: 800; color: #99C63E; margin-bottom: 20px; }
        input { 
            padding: 15px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 8px; 
            border: 2px solid #99C63E; /* Flip Out Green */
            background: #1a0a30; 
            color: white; 
            text-align: center; 
            margin-bottom: 20px; 
            font-family: inherit; 
            font-size: 1rem;
        }
        .video-container { 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto 20px auto; 
            border: 4px solid #FF509F; /* Flip Out Pink */
            border-radius: 8px; 
            background: #000; 
            overflow: hidden;
            position: relative;
        }
        iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
        #timer-text { color: #FF509F; font-size: 1.2rem; margin-top: 15px; font-weight: 700; }
        #seconds { color: #99C63E; }
        .btn { 
            padding: 20px 40px; 
            background-color: #99C63E; /* Flip Out Green */
            color: #0F041D; 
            font-weight: 800; 
            text-decoration: none; 
            border-radius: 8px; 
            display: inline-block; 
            margin-top: 20px; 
            cursor: pointer; 
            border: none; 
            font-family: inherit;
            font-size: 1.1rem;
        }
        
        /* Custom Branded Pop-up Modal */
        #token-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 4, 29, 0.95); /* Velvet Overlay */
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a0a30;
            border: 4px solid #FF509F; /* Pink Border */
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            width: 85%;
            max-width: 450px;
            box-shadow: 0 0 20px rgba(255, 80, 159, 0.3);
        }
        #token-display { font-size: 2rem; font-weight: 800; color: #99C63E; margin: 20px 0; }
    </style>
</head>
<body>

    <div id="lockout-page">
        <h1>FLIP OUT SAFETY BRIEFING</h1>
        <input type="text" id="employeeName" placeholder="Enter your first name...">
        <br>
        <button class="btn" onclick="startBriefing()">START BRIEFING</button>
    </div>

    <div id="video-page">
        <div class="video-container">
            <iframe id="yt-player" src="https://www.youtube.com/embed/sjWH8J2XKas?enablejsapi=1&controls=0&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div id="timer-text">Please watch for <span id="seconds">243</span> more seconds...</div>
    </div>

    <div id="token-modal">
        <div class="modal-content">
            <h2 style="color: #FFFFFF; margin: 0; font-size: 1.4rem;">BRIEFING COMPLETE</h2>
            <div id="token-display"></div>
            <p style="color: #FF509F; font-weight: 700; margin-bottom: 10px;">Tap below to copy your token and open Deputy!</p>
            <button class="btn" onclick="handleSecureCopyAndRedirect()">🚀 COPY &amp; OPEN DEPUTY</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const VIDEO_DURATION_SECONDS = 243; // 4 mins 3 secs
        let player;
        let countdownInterval;
        let timeLeft = VIDEO_DURATION_SECONDS;
        let userName = "";
        let globalToken = ""; 

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player');
        }

        function startBriefing() {
            const nameInput = document.getElementById('employeeName').value.trim();
            if (!nameInput) { 
                alert("Please enter your name first!"); 
                return; 
            }
            userName = nameInput;
            
            document.getElementById('lockout-page').style.display = 'none';
            document.getElementById('video-page').style.display = 'block';
            
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
            
            const timerDisplay = document.getElementById('seconds');
            const timerTextContainer = document.getElementById('timer-text');
            
            timerDisplay.textContent = timeLeft;
            
            countdownInterval = setInterval(() => {
                if (player && typeof player.getPlayerState === 'function') {
                    const state = player.getPlayerState();
                    
                    if (state === 1) {
                        timeLeft--;
                        if (timeLeft > 0) {
                            timerDisplay.textContent = timeLeft;
                        }
                    }
                    
                    // Trigger when video ends or timer hits 0
                    if (state === 0 || timeLeft <= 0) {
                        clearInterval(countdownInterval);
                        timerTextContainer.style.display = 'none';
                        
                        // Generate Token Formula
                        const cleanName = userName.toUpperCase().replace(/[^A-Z]/g, '') || "GUEST";
                        let identifier = cleanName.substring(0, 3);
                        if (identifier.length < 3) {
                            identifier = (identifier + "XYZ").substring(0, 3);
                        }
                        
                        const d = new Date();
                        const dd = (d.getDate() + "").padStart(2, '0');
                        const mm = (d.getMonth() + 1 + "").padStart(2, '0');
                        globalToken = `FO-${identifier}-${dd}${mm}`;
                        
                        // Populate and show the custom tap modal
                        document.getElementById('token-display').textContent = globalToken;
                        document.getElementById('token-modal').style.display = 'flex';
                    }
                }
            }, 1000);
        }

        // Executed entirely within a trusted user-touch event context
        function handleSecureCopyAndRedirect() {
            if (globalToken) {
                // Securely write to clipboard with 100% browser authorization
                navigator.clipboard.writeText(globalToken)
                    .then(() => {
                        // Immediately shift app focus
                        window.location.href = "deputy://open";
                    })
                    .catch((err) => {
                        console.error("Clipboard failed: ", err);
                        // Fallback redirect if clipboard errors out
                        window.location.href = "deputy://open";
                    });
            }
        }
    </script>
</body>
</html>
