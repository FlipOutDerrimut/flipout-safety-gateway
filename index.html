<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Briefing | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Unbounded', sans-serif; 
            background-color: #0F041D; /* Flip Out Velvet */
            color: #FFFFFF; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        #lockout-page { text-align: center; width: 100%; max-width: 400px; }
        #video-page { display: none; width: 100%; text-align: center; }
        h1 { font-weight: 800; color: #99C63E; margin-bottom: 20px; }
        input { 
            padding: 15px; 
            width: 80%; 
            max-width: 300px; 
            border-radius: 8px; 
            border: 2px solid #99C63E; /* Flip Out Green */
            background: #1a0a30; 
            color: white; 
            text-align: center; 
            margin-bottom: 20px; 
            font-family: inherit; 
            font-size: 1rem;
        }
        .video-container { 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto 20px auto; 
            border: 4px solid #FF509F; /* Flip Out Pink */
            border-radius: 8px; 
            background: #000; 
            overflow: hidden;
            position: relative;
        }
        iframe { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
        #timer-text { color: #FF509F; font-size: 1.2rem; margin-top: 15px; font-weight: 700; }
        #seconds { color: #99C63E; }
        .btn { 
            padding: 20px 40px; 
            background-color: #99C63E; 
            color: #0F041D; 
            font-weight: 800; 
            text-decoration: none; 
            border-radius: 8px; 
            display: inline-block; 
            margin-top: 20px; 
            cursor: pointer; 
            border: none; 
            font-family: inherit;
            font-size: 1.1rem;
        }
        #done-ui { display: none; margin-top: 20px; }
        #token-display { font-size: 1.8rem; font-weight: 800; color: #99C63E; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="lockout-page">
        <h1>FLIP OUT SAFETY BRIEFING</h1>
        <input type="text" id="employeeName" placeholder="Enter your first name...">
        <br>
        <button class="btn" onclick="startBriefing()">START BRIEFING</button>
    </div>

    <div id="video-page">
        <div class="video-container">
            <iframe id="yt-player" src="https://www.youtube.com/embed/sjWH8J2XKas?enablejsapi=1&controls=0&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        
        <div id="timer-text">Please watch for <span id="seconds">243</span> more seconds...</div>

        <div id="done-ui">
            <div id="token-display"></div>
            <p style="color: #FF509F; font-weight: 700;">Token copied to clipboard!</p>
            <a href="deputy://open" class="btn" onclick="forceClipboardCopy()">🚀 OPEN DEPUTY</a>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const VIDEO_DURATION_SECONDS = 243; // 4 mins 3 secs
        let player;
        let countdownInterval;
        let timeLeft = VIDEO_DURATION_SECONDS;
        let userName = "";
        let globalToken = ""; 

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player');
        }

        function startBriefing() {
            const nameInput = document.getElementById('employeeName').value.trim();
            if (!nameInput) { 
                alert("Please enter your name first!"); 
                return; 
            }
            userName = nameInput;
            
            document.getElementById('lockout-page').style.display = 'none';
            document.getElementById('video-page').style.display = 'block';
            
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
            }
            
            const timerDisplay = document.getElementById('seconds');
            const timerTextContainer = document.getElementById('timer-text');
            const doneUi = document.getElementById('done-ui');
            const tokenDisplay = document.getElementById('token-display');
            
            timerDisplay.textContent = timeLeft;
            
            countdownInterval = setInterval(() => {
                if (player && typeof player.getPlayerState === 'function') {
                    const state = player.getPlayerState();
                    
                    // 1. Ticks down if video is actively playing
                    if (state === 1) {
                        timeLeft--;
                        if (timeLeft > 0) {
                            timerDisplay.textContent = timeLeft;
                        }
                    }
                    
                    // 2. BUG FIX: Trigger immediately if video finishes (state 0) OR timer runs out
                    if (state === 0 || timeLeft <= 0) {
                        clearInterval(countdownInterval);
                        timerTextContainer.style.display = 'none';
                        
                        // Generate Personalised Formula
                        const cleanName = userName.toUpperCase().replace(/[^A-Z]/g, '') || "GUEST";
                        let identifier = cleanName.substring(0, 3);
                        if (identifier.length < 3) {
                            identifier = (identifier + "XYZ").substring(0, 3);
                        }
                        
                        const d = new Date();
                        const dd = (d.getDate() + "").padStart(2, '0');
                        const mm = (d.getMonth() + 1 + "").padStart(2, '0');
                        globalToken = `FO-${identifier}-${dd}${mm}`;
                        
                        // Display token layout
                        tokenDisplay.textContent = `TOKEN: ${globalToken}`;
                        doneUi.style.display = 'block';
                        
                        // Clipboard passive execution
                        navigator.clipboard.writeText(globalToken).catch(() => {});
                        
                        // Force execution via pop-up wrapper
                        alert(`YOUR SAFETY TOKEN IS: ${globalToken}\n\nClick OK to copy your token and open the Deputy App.`);
                        
                        // Deep link jump execution
                        window.location.href = "deputy://open";
                    }
                }
            }, 1000);
        }

        // Physical tap clipboard capture fallback
        function forceClipboardCopy() {
            if (globalToken) {
                navigator.clipboard.writeText(globalToken);
            }
        }
    </script>
</body>
</html>
