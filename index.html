<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Gateway | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Unbounded', sans-serif; background: #0F041D; color: #FFF; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        h1 { color: #99C63E; margin-bottom: 20px; }
        input { padding: 15px; border-radius: 8px; border: 2px solid #99C63E; width: 80%; max-width: 300px; margin-bottom: 20px; background: #1a0a30; color: #FFF; text-align: center; }
        video { width: 100%; max-width: 600px; border-radius: 8px; border: 4px solid #FF509F; background: #000; }
        #token-display { font-size: 1.5rem; font-weight: 800; color: #99C63E; margin: 20px 0; display: none; }
        .btn { padding: 18px 36px; background: #99C63E; color: #0F041D; font-weight: 800; text-decoration: none; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <h1>SAFETY BRIEFING</h1>
    <input type="text" id="name" placeholder="Enter First Name">
    <video id="v" controls playsinline>
        <source src="safety-video.mp4" type="video/mp4">
    </video>
    <div id="token-display"></div>
    <a href="deputy://open" id="btn" class="btn">🚀 OPEN DEPUTY</a>

    <script>
        const v = document.getElementById('v'), btn = document.getElementById('btn'), disp = document.getElementById('token-display');
        v.onended = () => {
            const n = document.getElementById('name').value.toUpperCase().replace(/[^A-Z]/g, '') || "GUEST";
            const id = (n + "XYZ").substring(0, 3);
            const d = new Date(), date = (d.getDate() + "").padStart(2, '0') + (d.getMonth() + 1 + "").padStart(2, '0');
            const token = `FO-${id}-${date}`;
            
            disp.textContent = `TOKEN: ${token}`;
            disp.style.display = 'block';
            btn.style.display = 'block';
            navigator.clipboard.writeText(token);
            window.location.href = "deputy://open";
        };
    </script>
</body>
</html>
