<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Briefing</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 600px; border-radius: 8px; }
        #clock-in-wrapper { display: none; margin-top: 30px; }
        .btn { 
            padding: 15px 30px; 
            background-color: #2ecc71; 
            color: white; 
            font-weight: bold; 
            text-decoration: none; 
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>Daily Safety Briefing</h1>
    <p>Watch the video below to get your token.</p>

    <video id="myVideo" controls>
        <source src="safety-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="clock-in-wrapper">
        <p>Video complete! Ready to start your shift?</p>
        <a href="deputy://open" class="btn">🚀 Open Deputy & Clock In</a>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const buttonWrapper = document.getElementById('clock-in-wrapper');

        video.addEventListener('ended', () => {
            buttonWrapper.style.display = 'block';
        });
    </script>
</body>
</html>
