<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Briefing | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Unbounded', sans-serif; background-color: #0F041D; color: #FFFFFF; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #lockout-page { text-align: center; width: 80%; }
        #video-page { display: none; width: 100%; text-align: center; }
        input { padding: 15px; width: 100%; max-width: 300px; border-radius: 8px; border: 2px solid #99C63E; background: #1a0a30; color: white; text-align: center; margin-bottom: 20px; font-family: inherit; }
        .video-container { width: 90%; max-width: 600px; margin: 0 auto; border: 4px solid #FF509F; border-radius: 8px; background: #000; }
        iframe { width: 100%; aspect-ratio: 16/9; }
        .btn { padding: 20px 40px; background-color: #99C63E; color: #0F041D; font-weight: 800; text-decoration: none; border-radius: 8px; display: inline-block; margin-top: 20px; cursor: pointer; border: none; font-family: inherit; }
        #done-ui { display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="lockout-page">
        <h1>SAFETY GATEWAY</h1>
        <input type="text" id="name" placeholder="Enter first name...">
        <br>
        <button class="btn" onclick="startBriefing()">START BRIEFING</button>
    </div>

    <div id="video-page">
        <div class="video-container">
            <iframe id="yt-player" 
                    src="https://youtu.be/sjWH8J2XKas" 
                    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
            </iframe>
        </div>
        <div id="done-ui">
            <h2 id="token" style="color: #99C63E;"></h2>
            <p>Code copied to clipboard!</p>
            <a href="deputy://open" class="btn">🚀 OPEN DEPUTY</a>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let userName = "";

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function startBriefing() {
            userName = document.getElementById('name').value;
            if(!userName) { alert("Please enter your name!"); return; }
            
            document.getElementById('lockout-page').style.display = 'none';
            document.getElementById('video-page').style.display = 'block';
            player.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === 0) {
                const name = userName.toUpperCase().substring(0, 3);
                const d = new Date();
                const token = `FO-${name}-${(d.getDate()+'').padStart(2,'0')}${(d.getMonth()+1+'').padStart(2,'0')}`;
                
                document.getElementById('token').textContent = `TOKEN: ${token}`;
                document.getElementById('done-ui').style.display = 'block';
                
                navigator.clipboard.writeText(token);
                window.location.href = "deputy://open";
            }
        }
    </script>
</body>
</html>
