<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Briefing | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Unbounded', sans-serif; 
            padding: 20px; 
            background-color: #0F041D; 
            color: #FFFFFF; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { font-weight: 800; color: #99C63E; margin-bottom: 10px; }
        video { 
            width: 100%; 
            max-width: 600px; 
            border-radius: 8px; 
            border: 4px solid #FF509F;
            background-color: #000;
        }
        #clock-in-wrapper { margin-top: 30px; text-align: center; display: none; }
        #timer-text { color: #FF509F; font-size: 1.2rem; margin-top: 10px; }
        .btn { 
            padding: 20px 40px; 
            background-color: #99C63E; 
            color: #0F041D; 
            font-weight: 800; 
            text-decoration: none; 
            border-radius: 8px;
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>SAFETY BRIEFING</h1>
    <p>Watch the video to unlock your clock-in link.</p>

    <video id="myVideo" controls playsinline>
        <source src="safety-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="timer-text">Please watch for <span id="seconds">30</span> more seconds...</div>

    <div id="clock-in-wrapper">
        <a href="deputy://open" class="btn">🚀 OPEN DEPUTY & CLOCK IN</a>
    </div>

    <script>
        let timeLeft = 30; // Set this to the length of your video
        const timerDisplay = document.getElementById('seconds');
        const timerText = document.getElementById('timer-text');
        const buttonWrapper = document.getElementById('clock-in-wrapper');

        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerText.style.display = 'none';
                buttonWrapper.style.display = 'block';
            }
        }, 1000);
    </script>
</body>
</html>
