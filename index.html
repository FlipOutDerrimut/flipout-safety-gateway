<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mandatory Safety Briefing</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 640px; margin: 0 auto; }
        
        #timer-box { font-size: 20px; margin-bottom: 15px; color: #ffb3b3; font-weight: bold; }
        #timer { color: #ff4d4d; font-family: 'Courier New', Courier, monospace; font-size: 24px; }
        
        /* 📱 PORTRAIT VIEW VIDEO CONTAINER */
        .video-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9;
            margin: 10px auto;
            border: 3px solid #ff4d4d; 
            border-radius: 8px; 
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 👑 HIGH-VISIBILITY COMPLETION OVERLAY */
        #token-box { 
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 122, 67, 0.98); 
            z-index: 100000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 28px; 
            font-weight: bold; 
            box-sizing: border-box;
            padding: 20px;
        }
        
        /* 🔄 AUTOMATIC SMART-LANDSCAPE TAKEOVER */
        @media (orientation: landscape) {
            #setup-ui { 
                display: none; /* Instantly hides title and text to make room */
            }
            body { 
                padding: 0; 
                margin: 0; 
                background: #000; 
                overflow: hidden;
            }
            .video-wrapper {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                margin: 0;
                max-width: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-ui">
        <h2>⚠️ Mandatory Site Safety Induction</h2>
        <p>You must watch this custom in-store safety video in full to unlock your shift code.</p>
        <div id="timer-box">
            ⏳ Time Remaining: <span id="timer">Loading...</span>
        </div>
        <p style="font-size: 13px; color: #aaa;">💡 Tip: Turn your phone sideways to watch in full screen.</p>
    </div>

    <div class="video-wrapper">
        <div id="player"></div>
        
        <div id="token-box">
            🎉 Shift Unlocked!<br>
            <span style="font-size: 16px; font-weight: normal; display: block; margin-top: 10px;">Your Deputy Verification Code:</span>
            <span id="code" style="background: #1a1a1a; padding: 5px 15px; border-radius: 6px; display: inline-block; margin-top: 5px; border: 2px solid #fff;">SAFE-7729</span>
        </div>
    </div>
</div>

<script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var lastCheckTime = 0;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            width: '100%',   
            height: '100%',  
            videoId: 'sjWH8J2XKas', 
            playerVars: {
                'controls': 0,        
                'disablekb': 1,      
                'rel': 0,             
                'modestbranding': 1,
                'playsinline': 1  /* Keeps player embedded inside our secure system */
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        setInterval(function() {
            preventSkipping();
            updateCountdown();
        }, 500);
    }

    function preventSkipping() {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        var currentTime = player.getCurrentTime();
        
        if (currentTime > lastCheckTime + 2) {
            player.seekTo(lastCheckTime);
        } else {
            lastCheckTime = currentTime;
        }
    }

    function updateCountdown() {
        if (!player || typeof player.getDuration !== 'function' || typeof player.getCurrentTime !== 'function') return;
        
        var duration = player.getDuration();
        var currentTime = player.getCurrentTime();
        var timeLeft = Math.max(0, Math.floor(duration - currentTime));
        
        var minutes = Math.floor(timeLeft / 60);
        var seconds = timeLeft % 60;
        if (seconds < 10) seconds = '0' + seconds;
        
        if (timeLeft > 0) {
            document.getElementById('timer').innerText = minutes + ":" + seconds;
        } else {
            document.getElementById('timer-box').innerHTML = "✅ Video Completed Successfully";
        }
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.ENDED) {
            /* Switch display to flex to center the unlock modal perfectly over the video */
            document.getElementById('token-box').style.display = 'flex';
        }
    }
</script>
</body>
</html>
