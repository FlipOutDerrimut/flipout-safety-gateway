<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Gateway | Flip Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Unbounded', sans-serif; padding: 20px; 
            background-color: #0F041D; color: #FFFFFF; 
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        h1 { font-weight: 800; color: #99C63E; margin-bottom: 10px; }
        input { 
            padding: 12px; border-radius: 8px; border: none; 
            width: 80%; max-width: 300px; margin-bottom: 20px;
            font-family: inherit; font-size: 1rem;
        }
        video { 
            width: 100%; max-width: 600px; border-radius: 8px; 
            border: 4px solid #FF509F; background-color: #000;
        }
        #timer-text { color: #FF509F; font-size: 1.1rem; margin: 15px 0; }
        #clock-in-wrapper { display: none; margin-top: 20px; text-align: center; }
        .btn { 
            padding: 18px 36px; background-color: #99C63E; color: #0F041D; 
            font-weight: 800; text-decoration: none; border-radius: 8px;
            display: inline-block; font-size: 1.1rem;
        }
        #token-display { font-size: 1.5rem; font-weight: 800; color: #99C63E; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>SAFETY BRIEFING</h1>
    <input type="text" id="employeeName" placeholder="Enter your first name...">
    
    <video id="myVideo" controls playsinline>
        <source src="safety-video.mp4" type="video/mp4">
    </video>

    <div id="timer-text">Watch for <span id="seconds">30</span>s to reveal your token.</div>
    <div id="token-display"></div>

    <div id="clock-in-wrapper">
        <a href="deputy://open" class="btn">🚀 OPEN DEPUTY & CLOCK IN</a>
    </div>

    <script>
        // Timer Logic
        let timeLeft = 30;
        const timerDisplay = document.getElementById('seconds');
        const timerText = document.getElementById('timer-text');
        const btnWrapper = document.getElementById('clock-in-wrapper');
        const tokenDisplay = document.getElementById('token-display');
        const nameInput = document.getElementById('employeeName');

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerDisplay.textContent = timeLeft;
            } else {
                clearInterval(countdown);
                timerText.style.display = 'none';
                btnWrapper.style.display = 'block';
                
                // Generate Token Logic
                const name = nameInput.value.toUpperCase().replace(/[^A-Z]/g, '') || "GUEST";
                const identifier = (name + "XYZ").substring(0, 3);
                const d = new Date();
                const dateStr = (d.getDate() + "").padStart(2, '0') + (d.getMonth() + 1 + "").padStart(2, '0');
                tokenDisplay.textContent = `TOKEN: FO-${identifier}-${dateStr}`;
            }
        }, 1000);
    </script>
</body>
</html>
