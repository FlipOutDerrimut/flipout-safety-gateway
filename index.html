<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandatory Safety Briefing</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 640px; margin: 0 auto; }
        
        #timer-box { font-size: 20px; margin-bottom: 15px; color: #ffb3b3; font-weight: bold; }
        #timer { color: #ff4d4d; font-family: 'Courier New', Courier, monospace; font-size: 24px; }
        
        /* 📱 FLUID MOBILE RESPONSIVE WRAPPER */
        .video-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; /* Keeps the video standard widescreen on rotate */
            margin: 0 auto 15px auto;
            border: 3px solid #ff4d4d; 
            border-radius: 8px; 
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Clean Custom Expansion Button */
        .fullscreen-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .fullscreen-btn:hover { background: #444; }
        
        #token-box { display: none; margin-top: 20px; padding: 20px; background: #2b7a43; border-radius: 8px; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚠️ Mandatory Site Safety Induction</h2>
    <p>You must watch this custom in-store safety video in full to unlock your shift code.</p>
    
    <div id="timer-box">
        ⏳ Time Remaining: <span id="timer">Loading...</span>
    </div>

    <button class="fullscreen-btn" onclick="openFullscreen()">📺 Expand Video / Landscape</button>

    <div class="video-wrapper" id="videoContainer">
        <div id="player"></div>
    </div>

    <div id="token-box">
        🎉 Shift Unlocked!<br>
        Your Deputy Verification Code: <span id="code">SAFE-7729</span>
    </div>
</div>

<script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var lastCheckTime = 0;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            width: '100%',   // Changed to dynamic full width
            height: '100%',  // Changed to dynamic full height
            videoId: 'sjWH8J2XKas', 
            playerVars: {
                'controls': 0,        
                'disablekb': 1,      
                'rel': 0,             
                'modestbranding': 1   
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        setInterval(function() {
            preventSkipping();
            updateCountdown();
        }, 500);
    }

    function preventSkipping() {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        var currentTime = player.getCurrentTime();
        
        if (currentTime > lastCheckTime + 2) {
            player.seekTo(lastCheckTime);
        } else {
            lastCheckTime = currentTime;
        }
    }

    function updateCountdown() {
        if (!player || typeof player.getDuration !== 'function' || typeof player.getCurrentTime !== 'function') return;
        
        var duration = player.getDuration();
        var currentTime = player.getCurrentTime();
        var timeLeft = Math.max(0, Math.floor(duration - currentTime));
        
        var minutes = Math.floor(timeLeft / 60);
        var seconds = timeLeft % 60;
        if (seconds < 10) seconds = '0' + seconds;
        
        if (timeLeft > 0) {
            document.getElementById('timer').innerText = minutes + ":" + seconds;
        } else {
            document.getElementById('timer-box').innerHTML = "✅ Video Completed Successfully";
        }
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.ENDED) {
            // PRO MOVE: Automatically close fullscreen when finished so they instantly see their token code!
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            document.getElementById('token-box').style.display = 'block';
        }
    }

    // 🛠️ CUSTOM HTML5 FULLSCREEN LOGIC
    function openFullscreen() {
        var elem = document.getElementById("videoContainer");
        if (elem.requestFullscreen) {
            elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Native Safari / iOS phone support */
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }
</script>
</body>
</html>
